<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header><div class="logo">◈</div><div><b>Liquid Glass</b><small>OPTICAL MATERIAL · 04</small></div><input id="enabled" type="checkbox"></header>
<section><h2>预设</h2><div class="presets">
<button data-p="subtle">清透</button><button data-p="optical">光学玻璃</button><button data-p="prismatic">棱镜</button>
</div></section>
<section><h2>材质</h2>
<label>模糊 <output id="blurV"></output><input id="blur" type="range" min="0" max="28"></label>
<label>透明度 <output id="opacityV"></output><input id="opacity" type="range" min="5" max="60"></label>
<label>饱和度 <output id="saturationV"></output><input id="saturation" type="range" min="80" max="220"></label>
<label>圆角 <output id="radiusV"></output><input id="radius" type="range" min="0" max="32"></label>
<label>边缘光 <output id="edgeV"></output><input id="edge" type="range" min="0" max="100"></label>
<label>折射 <output id="refractionV"></output><input id="refraction" type="range" min="0" max="100"></label>
<label>焦散 <output id="causticsV"></output><input id="caustics" type="range" min="0" max="100"></label>
<label>辉光 <output id="bloomV"></output><input id="bloom" type="range" min="0" max="100"></label>
</section>
<section><h2>层</h2>
<label class="check"><input id="lighting" type="checkbox">镜面反射 / 边缘光</label>
<label class="check"><input id="pageGlow" type="checkbox">页面环境光</label>
<label class="check"><input id="surfaces" type="checkbox">浮层 / 菜单</label>
<label class="check"><input id="controls" type="checkbox">按钮 / 控件</label>
<label class="check"><input id="images" type="checkbox">媒体圆角</label>
</section>
<section><h2>排除网站</h2><textarea id="exclude" placeholder="example.com&#10;每行一个"></textarea></section>
<footer><span id="status">自动保存</span><button id="reset">恢复默认</button></footer>
</main><script src="popup.js"></script></body></html>
